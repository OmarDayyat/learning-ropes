<header class="border-b border-slate-200 bg-white">
  <div class="flex max-w-5xl items-center justify-between gap-4 mx-auto px-4 sm:px-6 py-4">
    <a
      routerLink="/"
      class="rounded-sm text-lg font-bold text-slate-900 hover:text-emerald-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600"
    >
      Learning Ropes
    </a>

    <!--
      routerLinkActive adds aria-current="page" to the link of the page you are on.
      The aria-[current=page]: classes then color and underline that link.
    -->
    <nav aria-label="Main">
      <ul class="flex items-center gap-5">
        <li>
          <a
            routerLink="/"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            class="rounded-sm border-b-2 border-transparent text-sm font-medium text-slate-600 hover:text-emerald-800 aria-[current=page]:border-emerald-600 aria-[current=page]:text-emerald-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 py-1"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/lessons"
            routerLinkActive
            ariaCurrentWhenActive="page"
            class="rounded-sm border-b-2 border-transparent text-sm font-medium text-slate-600 hover:text-emerald-800 aria-[current=page]:border-emerald-600 aria-[current=page]:text-emerald-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 py-1"
          >
            Lessons
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
