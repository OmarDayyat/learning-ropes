<div role="tablist" [attr.aria-label]="label()" class="flex border-b border-slate-200 gap-1">
  @for (tab of tabs(); track tab; let i = $index) {
    <button
      #tabButton
      type="button"
      role="tab"
      [id]="tabId(i)"
      [attr.aria-selected]="selected() === i"
      [attr.aria-controls]="panelId(i)"
      [attr.tabindex]="selected() === i ? 0 : -1"
      (click)="selected.set(i)"
      (keydown)="onKeydown($event, i)"
      class="border-b-2 text-sm font-medium hover:text-emerald-800 focus-ring -mb-px px-3 py-2"
      [class.border-emerald-600]="selected() === i"
      [class.border-transparent]="selected() !== i"
      [class.text-emerald-800]="selected() === i"
      [class.text-slate-600]="selected() !== i"
    >
      {{ tab.label() }}
    </button>
  }
</div>

<ng-content />
